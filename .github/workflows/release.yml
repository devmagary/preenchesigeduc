name: Release Preenche SIGEduc

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'docs/index.html'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.1.0). Deixe vazio para usar v<version> do package.json'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e testes unitários
        run: |
          npx tsc --noEmit
          npm run test:unit

      - name: Definir ou incrementar versão e tag automaticamente
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            EXISTING_TAG=$(git tag --points-at HEAD "v*" | head -n 1 || true)
            if [ -n "$EXISTING_TAG" ]; then
              TAG="$EXISTING_TAG"
            else
              NEXT_VER=$(npm version patch --no-git-tag-version | tr -d 'v')
              TAG="v${NEXT_VER}"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json
              git commit -m "chore(release): publica versão ${TAG} [skip ci]"
              git tag "${TAG}"
              git push origin HEAD:main "${TAG}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build e empacotamento (.zip e .crx)
        env:
          CRX_PRIVATE_KEY_PEM: ${{ secrets.CRX_PRIVATE_KEY_PEM }}
        run: |
          npm run build
          npm run package

      - name: Publicar artefatos no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/preenche-sigeduc-chrome.zip \
              dist/preenche-sigeduc-firefox.zip \
              dist/preenche-sigeduc-edge-mobile.crx \
              --clobber
          else
            gh release create "$TAG" \
              dist/preenche-sigeduc-chrome.zip \
              dist/preenche-sigeduc-firefox.zip \
              dist/preenche-sigeduc-edge-mobile.crx \
              --title "Preenche SIGEduc $TAG" \
              --notes "Pacotes oficiais Manifest V3 com nomes fixos para Chrome/Chromium, Firefox e Edge Canary Mobile (.crx)." \
              --latest
          fi

      - name: Publicar atualização na Chrome Web Store (quando secrets configurados)
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/cws-publish.mjs
