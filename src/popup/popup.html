<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preenche SIGEduc</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="header">
      <h1>Preenche SIGEduc</h1>
      <p>Notas, Frequências e Scraping no Diário Digital</p>
    </header>
    <section class="status-box" id="status-box">Verificando aba atual...</section>
    <div class="actions">
      <button id="btn-toggle" class="btn btn-primary" disabled>Abrir / Fechar Painel</button>
      <button id="btn-open-sigeduc" class="btn btn-secondary">Abrir Portal SIGEduc-BA</button>
    </div>
    <details class="about-details" id="popup-about-details">
      <summary>
        <span>Sobre / Aviso Legal e Privacidade</span>
        <span class="version-badge" id="popup-version">v1.0.0</span>
      </summary>
      <div class="about-content" id="popup-about-content"></div>
    </details>
    <footer class="footer">100% local no navegador • Nenhuma senha é salva</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
